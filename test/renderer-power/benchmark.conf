# Existing preferences.
copy-on-select = clipboard
macos-titlebar-style = tabs

# Dark CRT edge color also sets the macOS tab titlebar color.
# The shader gently lifts the screen center above this base.
# Homebrew with lightness-first AA contrast adjustments for ANSI text slots 1-15.
# Source colors clear 4.5:1 against the brightest current CRT screen background.
# ANSI 0 stays dark for backgrounds/inverse text and is the documented exception.
# CRT post-processing and app-defined colors can reduce contrast below AA.
# Original palette: https://terminalthemes.com/themes/homebrew
background = #070e0a
foreground = #00ff00
selection-background = #083905
selection-foreground = #ffffff
cursor-color = #23ff18
cursor-text = #000000
palette = 0=#070e0a
palette = 1=#dd5343
palette = 2=#00a600
palette = 3=#999900
palette = 4=#4079ff
palette = 5=#d43cd3
palette = 6=#00a6b2
palette = 7=#bfbfbf
palette = 8=#818181
palette = 9=#ff5948
palette = 10=#00d900
palette = 11=#e5e500
palette = 12=#5f91ff
palette = 13=#f72df6
palette = 14=#00e5e5
palette = 15=#e5e5e5

font-family = Cascadia Code
font-size = 14
font-feature = calt, liga
cursor-style = block
cursor-style-blink = false
# Preserve the block cursor at shell prompts.
shell-integration-features = no-cursor

background-opacity = 1
window-padding-x = 14
window-padding-y = 14

# Static CRT effects. Comment out custom-shader to disable them.
custom-shader = fast.glsl
custom-shader-animation = false

# Offscreen throughput is intentionally uncapped.
window-vsync = false
